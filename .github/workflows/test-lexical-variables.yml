name: Test block-lexical-variables

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint and formatting do not vary by Node version, so they run once rather
  # than once per matrix entry.
  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: block-lexical-variables/package-lock.json

      - name: Install dependencies
        working-directory: block-lexical-variables
        run: npm ci

      - name: Lint
        working-directory: block-lexical-variables
        run: npm run lint

      - name: Check formatting
        working-directory: block-lexical-variables
        run: npm run format:check

  test-lexical-variables:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Blockly 13 declares engines.node >= 22, so 20 is no longer a
        # supported floor. 24 is the current LTS.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: block-lexical-variables/package-lock.json

      - name: Install dependencies
        working-directory: block-lexical-variables
        run: npm ci

      - name: Run block-lexical-variables tests
        working-directory: block-lexical-variables
        run: npm run test

      # The test build targets Node, so it never exercises the production
      # webpack config. Building here catches bundling breakage that the
      # suites cannot see.
      - name: Build block-lexical-variables
        working-directory: block-lexical-variables
        run: npm run build
